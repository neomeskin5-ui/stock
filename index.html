<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A41">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>2배 레버리지 리밸런싱</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#1B2A41;--paper:#F3F5F8;--card:#fff;--line:#D9DFE8;--hair:#EEF1F5;--dim:#5B6B82;--down:#2F6FD6;--up:#D93A3A;--tint:#E9EDF3}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:16px 12px 48px}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px;line-height:1.25}
.sub{font-size:14px;color:var(--dim);margin:0 0 12px;line-height:1.5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:8px 10px;border:none;background:#fff;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.btn{font:inherit;font-size:15px;font-weight:600;padding:10px 14px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.btn.sec{background:#fff;color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.link{font:inherit;font-size:13px;color:var(--dim);background:none;border:none;padding:6px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--down);outline-offset:2px}
.dim{color:var(--dim);font-size:13px;margin:8px 0 0}
.msg{font-size:13px;background:var(--tint);border-radius:8px;padding:8px 10px;margin:10px 0;line-height:1.5}
.msg.err{background:#FBE9E9;color:#8A1F1F}
.market{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0 16px;border-left:6px solid var(--ink)}
.market.crisis{border-left-color:var(--down)}
.market .state{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-bottom:6px}
.market.crisis .state{color:var(--down)}
.market .state small{font-size:15px;font-weight:600;margin-left:8px;color:var(--dim)}
.market .mline{font-size:14px;line-height:1.55}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
.head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--ink);color:#fff;flex-wrap:wrap}
.sym{font-size:20px;font-weight:800;letter-spacing:.02em}
.desc{font-size:12px;color:#B9C4D6;flex:1;min-width:120px}
.badge{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid #fff;color:#fff}
.badge.stake{background:var(--down);border-color:var(--down)}
.badge.vhold{background:var(--up);border-color:var(--up)}
.body{padding:12px 14px 14px}
.status{padding:10px 12px;border-left:4px solid var(--ink);background:var(--paper);border-radius:0 8px 8px 0;font-size:14px;line-height:1.55;margin-bottom:12px}
.status .act{font-weight:700;margin-top:2px}
.status .up{color:var(--up)}
.status .down{color:var(--down)}
.status .guide{color:var(--dim);font-size:13px;margin-top:4px}
.orders{margin:4px 0 0;padding-left:0;list-style:none;font-size:13px;color:var(--dim)}
.orders li{padding:1px 0}
.empty{font-size:14px;color:var(--dim);line-height:1.55;margin:0 0 12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;font-weight:600;color:var(--dim);font-size:12px;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{text-align:right;padding:6px 6px;border-bottom:1px solid var(--hair);white-space:nowrap}
tr.cur td{font-weight:700}
tr.cur td:first-child{box-shadow:inset 4px 0 0 var(--ink)}
td.done{color:var(--down);font-weight:600}
td.off,th.off{color:#A7B1C2;font-weight:400}
.note{font-size:12px;color:var(--dim);margin:6px 0 0;line-height:1.5}
.log{margin-top:12px;font-size:13px;color:var(--dim);border-top:1px solid var(--hair);padding-top:8px}
.log div{display:flex;gap:8px;flex-wrap:wrap;padding:3px 0}
.log .sig{color:var(--up);font-weight:600}
.log .sigdown{color:var(--down);font-weight:600}
details{margin-top:12px}
summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
input,select{width:100%;font:inherit;font-size:16px;padding:8px 10px;border:1px solid #C9D2DE;border-radius:8px;background:#fff;color:var(--ink)}
.settings{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 16px}
.settings summary{font-size:15px}
.rules{font-size:13px;color:var(--dim);line-height:1.6;padding:0 4px}
.rules h2{font-size:14px;color:var(--ink);margin:0 0 4px}
.rules ul{margin:0;padding-left:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>2배 레버리지 리밸런싱</h1>
  <p class="sub" id="sub"></p>
  <div class="row">
    <div class="seg" id="regime">
      <button type="button" data-r="hike">금리인상기 5%</button>
      <button type="button" data-r="zero">제로금리 2.5%</button>
    </div>
    <button type="button" class="btn" id="refresh">시세 새로고침</button>
  </div>
  <p class="dim" id="updated"></p>
  <div id="msg"></div>
  <div id="market"></div>
  <div id="tickers"></div>

  <details class="settings" id="settings">
    <summary>설정</summary>
    <div class="grid">
      <div style="grid-column:1/-1"><label for="apiKey">Twelve Data API 키</label><input id="apiKey" type="password" autocomplete="off" placeholder="twelvedata.com에서 무료 발급"></div>
      <div><label for="ndx">나스닥 대용 심볼</label><input id="ndx" placeholder="ONEQ" autocapitalize="characters"></div>
      <div><label for="threshold">위기 기준 등락률 %</label><input id="threshold" type="number" step="0.1"></div>
      <div><label for="stepRebal">리밸런싱 간격 %</label><input id="stepRebal" type="number" step="0.5" min="1" max="10"></div>
      <div><label for="stepHike">말뚝박기 간격, 금리인상기 %</label><input id="stepHike" type="number" step="0.5" min="1" max="10"></div>
      <div><label for="stepZero">말뚝박기 간격, 제로금리 %</label><input id="stepZero" type="number" step="0.5" min="1" max="10"></div>
    </div>
    <div class="row" style="margin-top:10px;justify-content:space-between">
      <button type="button" class="btn" id="saveSettings">설정 저장</button>
      <button type="button" class="link" id="wipe">모든 데이터 지우기</button>
    </div>
    <p class="note">키와 기록은 이 기기 브라우저에만 저장됩니다. 나스닥 종합지수는 무료 플랜에서 바로 받을 수 없어, 종합지수를 추종하는 ONEQ의 등락률로 −3%를 판단합니다.</p>
  </details>

  <section class="rules" id="rules"></section>
</div>

<script>
// ===== ENGINE START =====
const ZONES = 10, UNIT = 10;
const r2 = (x) => Math.round(x * 100) / 100;
const level = (ref, k, s) => r2(ref * (1 - k * s));
function zoneOf(ref, price, s) {
  if (!ref || price == null || !(price < ref)) return 0;
  return Math.min(ZONES, Math.floor((ref - price) / ref / s + 1e-9));
}
function addMonths(dateStr, months, days) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const tm = m - 1 + months;
  const ty = y + Math.floor(tm / 12), tmm = ((tm % 12) + 12) % 12;
  const lastDay = new Date(Date.UTC(ty, tmm + 1, 0)).getUTCDate();
  return new Date(Date.UTC(ty, tmm, Math.min(d, lastDay) + days)).toISOString().slice(0, 10);
}
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);

// 나스닥(대용 ETF) 일봉(오름차순) → 날짜별 시장 정보: -3% 발생, 대기 종료일, 연속 상승
function buildMarket(bars, thresholdPct) {
  const byDate = {}, events = [];
  let streak = 0, waitUntil = null, waitMonths = 1;
  for (let i = 0; i < bars.length; i++) {
    const b = bars[i];
    const pct = i > 0 ? (b.close / bars[i - 1].close - 1) * 100 : null;
    const event = pct != null && pct <= thresholdPct;
    streak = pct != null && pct > 0 ? streak + 1 : 0;
    if (event) {
      events.push(b.date);
      // 최근 두 달의 발생일 중 한 달 창 안에 4회 이상이면 두 달+1일 대기
      const recent = events.filter((e) => e >= addMonths(b.date, -2, 0));
      const four = recent.some((st) => recent.filter((e) => e >= st && e <= addMonths(st, 1, 0)).length >= 4);
      waitMonths = four ? 2 : 1;
      waitUntil = addMonths(b.date, waitMonths, 1);
    }
    const lastEvent = events.length ? events[events.length - 1] : null;
    byDate[b.date] = {
      date: b.date, close: b.close, pct, event, streak, lastEvent, waitUntil, waitMonths,
      crisis: !!lastEvent && b.date < waitUntil,
      recentEvents: events.filter((e) => e >= addMonths(b.date, -2, 0)),
    };
  }
  return { byDate, last: bars.length ? byDate[bars[bars.length - 1].date] : null };
}

function describeMove(from, to) {
  if (to > from) return `주식 ${to - from}% 매수, 주식 ${to}%`;
  if (to < from) return `주식 ${from - to}% 매도, 주식 ${to}%`;
  return "그대로 유지";
}

// 하루치(종가·저가·시장정보)를 종목 상태에 적용
function stepTicker(t, cfg, day) {
  const mk = day.mk || {};
  const n = Object.assign({}, t);
  const sR = cfg.stepRebal / 100, sS = cfg.stepStake / 100;
  const kMax0 = t.kMax || 0;
  let signal = "", target = t.stock == null ? 100 : t.stock;
  const notes = [];
  const waitOver = mk.waitUntil ? day.date >= mk.waitUntil : false;
  const exitReason = !mk.event && (waitOver ? "대기 기간 종료" : (mk.streak || 0) >= 8 ? "8거래일 연속 상승" : null);

  if (t.mode === "stake") {
    if (exitReason) {
      const k = zoneOf(t.ref, day.close, sS);
      n.mode = "rebal"; n.ref = day.close > t.ref ? r2(day.close) : level(t.ref, k, sS); n.kMax = 0; n.vZone = null; target = 100;
      signal = exitReason + ", 전량 매수";
    } else {
      const kLow = zoneOf(t.ref, day.low, sS);
      let fills = 0;
      if (kLow > kMax0) { fills = kLow - kMax0; n.kMax = kLow; }
      target = Math.min(100, (n.kMax || 0) * UNIT);
      if ((n.kMax || 0) >= 2 && day.close >= level(t.ref, n.kMax - 2, sS)) {
        n.mode = "vhold"; n.vZone = n.kMax - 2; target = 100; signal = "V자 반등, 남은 현금 전부 매수";
      } else if (fills) signal = `말뚝 ${fills}개 체결`;
      if (mk.event) notes.push("새 −3%, 대기 재시작");
    }
  } else if (t.mode === "vhold") {
    if (exitReason) {
      const k = zoneOf(t.ref, day.close, sS);
      n.mode = "rebal"; n.ref = day.close > t.ref ? r2(day.close) : level(t.ref, k, sS); n.kMax = 0; n.vZone = null; target = 100;
      signal = exitReason + ", 리밸런싱 복귀";
    } else {
      const k = zoneOf(t.ref, day.close, sS);
      if (k >= (t.vZone || 0) + 3) {
        n.mode = "stake"; n.ref = level(t.ref, k, sS); n.kMax = 0; n.vZone = null; target = 0;
        signal = "3구간 하락, 전량 매도 후 말뚝박기 재진입";
      } else target = 100;
      if (mk.event) notes.push("새 −3%, 대기 재시작");
    }
  } else {
    // 평시 리밸런싱
    if (cfg.crisis && mk.event) {
      const ref = t.ref || r2(day.close);
      const k = zoneOf(ref, day.close, sS);
      n.mode = "stake"; n.ref = ref; n.kMax = k; n.vZone = null; target = k * UNIT;
      signal = `나스닥 ${fmtPct(mk.pct)}, 말뚝박기 진입`;
    } else if (!t.ref || day.close > t.ref) {
      signal = t.ref ? "전고점 갱신" : "기준가 설정";
      n.ref = r2(day.close); n.kMax = 0; target = 100;
    } else if (kMax0 >= 2 && day.close >= level(t.ref, kMax0 - 2, sR)) {
      signal = "V자 반등"; n.ref = level(t.ref, kMax0 - 2, sR); n.kMax = 0; target = 100;
    } else {
      n.kMax = Math.max(kMax0, zoneOf(t.ref, day.close, sR)); target = 100 - n.kMax * UNIT;
    }
  }
  n.stock = target; n.lastDate = day.date; n.lastClose = day.close; n.lastLow = day.low;
  n.action = describeMove(t.stock == null ? 100 : t.stock, target);
  n.signal = [signal].concat(notes).filter(Boolean).join(", ");
  const entry = { date: day.date, close: day.close, low: day.low, mode: n.mode, stock: target, signal: n.signal, action: n.action, ref: n.ref };
  n.log = [entry].concat(t.log || []).slice(0, 40);
  return n;
}
const fmtPct = (n) => n == null || !Number.isFinite(n) ? "—" : (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(1) + "%";
// ===== ENGINE END =====

// ---------- 저장 ----------
const KEY_STATE = "rebal2x-web-v1", KEY_DATA = "rebal2x-data-v1";
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const DEFAULT_TICKERS = {
  QLD: { sym: "QLD", desc: "ProShares Ultra QQQ (나스닥100 2배)", crisis: true },
  BITX: { sym: "BITX", desc: "Volatility Shares 2x Bitcoin Strategy (비트코인 2배)", crisis: false },
};
const newTicker = (sym) => Object.assign({}, DEFAULT_TICKERS[sym], { mode: "rebal", ref: null, kMax: 0, stock: 100, vZone: null, lastDate: null, lastClose: null, lastLow: null, signal: "", action: "", log: [] });
const defaultSettings = () => ({ apiKey: "", ndx: "ONEQ", threshold: -3, stepRebal: 5, stepStakeHike: 5, stepStakeZero: 2.5, regime: "hike" });

function load() {
  const s = store.get(KEY_STATE) || {};
  const tickers = {};
  for (const sym of Object.keys(DEFAULT_TICKERS)) tickers[sym] = Object.assign(newTicker(sym), (s.tickers && s.tickers[sym]) || {}, { crisis: DEFAULT_TICKERS[sym].crisis, desc: DEFAULT_TICKERS[sym].desc });
  return { settings: Object.assign(defaultSettings(), s.settings || {}), tickers, market: s.market || null };
}
let state = load();
let data = store.get(KEY_DATA) || null;
let memoryOnly = false;
function save() { if (!store.set(KEY_STATE, state)) memoryOnly = true; }
const stakeStep = () => state.settings.regime === "zero" ? state.settings.stepStakeZero : state.settings.stepStakeHike;
const cfgFor = (t) => ({ stepRebal: state.settings.stepRebal, stepStake: stakeStep(), crisis: !!t.crisis });

// ---------- 표시 유틸 ----------
const fmt = (n) => n == null || !Number.isFinite(n) ? "—" : n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const zoneLabel = (k, step) => k === 0 ? "기준가" : "−" + r2(k * step) + "%";
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = (d) => d ? d.slice(5).replace("-", "/") : "—";
const modeLabel = { rebal: "리밸런싱", stake: "말뚝박기", vhold: "V반등 보유" };
function nyNow() {
  const f = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour12: false, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", weekday: "short" });
  const p = {};
  for (const x of f.formatToParts(new Date())) p[x.type] = x.value;
  return { date: `${p.year}-${p.month}-${p.day}`, minutes: (Number(p.hour) % 24) * 60 + Number(p.minute), weekday: p.weekday };
}
function isLive(barDate) {
  const n = nyNow();
  return barDate === n.date && n.minutes >= 9 * 60 + 30 && n.minutes < 16 * 60 + 5 && n.weekday !== "Sat" && n.weekday !== "Sun";
}
function showMsg(text, err) {
  const el = document.getElementById("msg");
  el.innerHTML = text ? `<div class="msg ${err ? "err" : ""}">${esc(text)}</div>` : "";
}

// ---------- 시세 ----------
async function fetchSeries(key, symbols) {
  const url = `https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(symbols.join(","))}&interval=1day&outputsize=260&apikey=${encodeURIComponent(key)}`;
  const res = await fetch(url);
  const j = await res.json();
  if (j && j.status === "error") throw new Error(j.message || "API 오류");
  const out = {};
  for (const sym of symbols) {
    const obj = symbols.length === 1 ? j : j[sym];
    if (!obj || obj.status === "error" || !Array.isArray(obj.values)) throw new Error(`${sym}: ${(obj && obj.message) || "데이터 없음"}`);
    out[sym] = obj.values
      .map((v) => ({ date: String(v.datetime).slice(0, 10), close: Number(v.close), low: Number(v.low) }))
      .filter((v) => Number.isFinite(v.close) && Number.isFinite(v.low))
      .reverse();
  }
  return out;
}

function marketFromData() {
  if (!data || !data.bars) return { market: null, liveBar: null };
  const ndx = data.bars[state.settings.ndx.toUpperCase()];
  if (!ndx || !ndx.length) return { market: null, liveBar: null };
  const lastBar = ndx[ndx.length - 1];
  const live = isLive(lastBar.date);
  const complete = live ? ndx.slice(0, -1) : ndx;
  return { market: buildMarket(complete, state.settings.threshold), liveBar: live ? lastBar : null, liveDate: live ? lastBar.date : null };
}

// 새 일봉을 날짜순으로 재생해 각 종목 상태를 갱신
function applyData() {
  const { market, liveBar, liveDate } = marketFromData();
  if (!market) throw new Error("나스닥 대용 심볼 데이터가 없습니다.");
  for (const sym of Object.keys(state.tickers)) {
    const t = state.tickers[sym];
    const bars = (data.bars[sym] || []).filter((b) => b.date !== liveDate);
    if (!bars.length) continue;
    if (!t.lastDate) {
      const b = bars[bars.length - 1];
      t.lastDate = b.date; t.lastClose = b.close; t.lastLow = b.low;
      if (!t.ref) t.ref = r2(b.close);
      t.action = "기준가와 주식 비율을 확인하세요"; t.signal = "시작";
      t.log = [{ date: b.date, close: b.close, low: b.low, mode: t.mode, stock: t.stock, signal: "시작", action: "", ref: t.ref }].concat(t.log || []);
      continue;
    }
    let cur = t;
    const cfg = cfgFor(t);
    for (const b of bars) {
      if (b.date <= t.lastDate) continue;
      cur = stepTicker(cur, cfg, { date: b.date, close: b.close, low: b.low, mk: market.byDate[b.date] || {} });
    }
    state.tickers[sym] = cur;
  }
  const L = market.last;
  state.market = L ? {
    sym: state.settings.ndx.toUpperCase(), date: L.date, pct: L.pct, crisis: L.crisis, lastEvent: L.lastEvent, waitUntil: L.waitUntil,
    waitMonths: L.waitMonths, streak: L.streak, events: L.recentEvents,
    live: liveBar ? { pct: (liveBar.close / L.close - 1) * 100 } : null,
  } : null;
  save();
}

async function refresh() {
  const s = state.settings;
  if (!s.apiKey) { showMsg("설정에서 Twelve Data API 키를 먼저 넣어주세요."); document.getElementById("settings").open = true; return; }
  const btn = document.getElementById("refresh");
  btn.disabled = true; btn.textContent = "불러오는 중…";
  try {
    const symbols = Array.from(new Set([s.ndx.toUpperCase()].concat(Object.keys(state.tickers))));
    const bars = await fetchSeries(s.apiKey, symbols);
    data = { fetchedAt: new Date().toISOString(), bars };
    store.set(KEY_DATA, data);
    applyData();
    showMsg("");
  } catch (e) {
    showMsg("시세를 불러오지 못했습니다: " + (e && e.message ? e.message : e), true);
  } finally {
    btn.disabled = false; btn.textContent = "시세 새로고침";
    render();
  }
}

// ---------- 수동 조정 ----------
function reevaluate(t) {
  if (!t.lastDate || t.lastClose == null) return;
  const { market } = marketFromData();
  const mk = market ? market.byDate[t.lastDate] || {} : {};
  const base = Object.assign({}, t, { log: (t.log || []).filter((e) => e.date !== t.lastDate) });
  Object.assign(t, stepTicker(base, cfgFor(t), { date: t.lastDate, close: t.lastClose, low: t.lastLow == null ? t.lastClose : t.lastLow, mk }));
}
function manualSave(sym) {
  const t = state.tickers[sym];
  const ref = parseFloat(document.getElementById("ref-" + sym).value);
  const stock = parseFloat(document.getElementById("stock-" + sym).value);
  const modeEl = document.getElementById("mode-" + sym);
  const mode = modeEl ? modeEl.value : "rebal";
  if (Number.isFinite(ref) && ref > 0) t.ref = r2(ref);
  if (Number.isFinite(stock)) t.stock = Math.max(0, Math.min(100, Math.round(stock / UNIT) * UNIT));
  t.mode = mode;
  if (mode === "rebal") { t.kMax = (100 - t.stock) / UNIT; t.vZone = null; }
  else if (mode === "stake") { t.kMax = t.stock / UNIT; t.vZone = null; }
  else { t.kMax = 0; t.vZone = t.ref && t.lastClose != null ? zoneOf(t.ref, t.lastClose, stakeStep() / 100) : 0; t.stock = 100; }
  reevaluate(t);
  save(); render();
  showMsg(sym + " 수동 조정을 저장했습니다.");
}
function fillHigh(sym) {
  const bars = data && data.bars && data.bars[sym];
  if (!bars || !bars.length) { showMsg("먼저 시세를 불러오세요."); return; }
  const hi = Math.max.apply(null, bars.slice(-250).map((b) => b.close));
  document.getElementById("ref-" + sym).value = r2(hi);
  showMsg(`${sym} 최근 1년 최고 종가 ${fmt(hi)}를 넣었습니다. 저장을 누르면 반영됩니다.`);
}
function resetTicker(sym) {
  if (!window.confirm(sym + " 기록을 지울까요? 다음 새로고침 때 최신 종가로 다시 시작합니다.")) return;
  state.tickers[sym] = newTicker(sym);
  save(); render();
}

// ---------- 렌더 ----------
function renderMarket() {
  const el = document.getElementById("market");
  const m = state.market;
  if (!m) {
    el.innerHTML = `<section class="market"><div class="state">대기 중</div><div class="mline">시세를 불러오면 나스닥 −3% 여부와 대기 기간이 여기에 표시됩니다.</div></section>`;
    return;
  }
  const lines = [];
  lines.push(`나스닥(${esc(m.sym)}) ${md(m.date)} 종가 ${fmtPct(m.pct)}, 연속 상승 ${m.streak}일${m.streak >= 8 ? " (8일 달성, 전량 매수 신호)" : ""}`);
  if (m.live) lines.push(`미국 장중, 현재 ${fmtPct(m.live.pct)} (확정 전이라 반영하지 않음)`);
  if (m.lastEvent) lines.push(`−3% 발생 ${m.events.map(md).join(", ")} (${m.events.length}회), 대기 종료 ${m.waitUntil} (${m.waitMonths === 2 ? "두 달" : "한 달"}+1일)`);
  else lines.push("최근 1년 나스닥 −3% 없음");
  const dday = m.crisis ? daysBetween(nyNow().date, m.waitUntil) : null;
  el.innerHTML = `<section class="market ${m.crisis ? "crisis" : ""}"><div class="state">${m.crisis ? `위기<small>대기 종료까지 ${dday}일</small>` : "평시"}</div>${lines.map((l) => `<div class="mline">${l}</div>`).join("")}</section>`;
}

function renderTable(t, cfg) {
  const active = t.mode === "rebal" ? "rebal" : "stake";
  const step = active === "rebal" ? cfg.stepRebal : cfg.stepStake;
  const s = step / 100;
  const both = t.crisis && cfg.stepRebal === cfg.stepStake;
  const kNow = t.lastClose != null ? zoneOf(t.ref, t.lastClose, s) : -1;
  const kMax = t.kMax || 0;
  const head = both
    ? `<th>구간</th><th>가격</th><th class="${active === "rebal" ? "" : "off"}">평시 주식/현금</th><th class="${active === "stake" ? "" : "off"}">위기 주식/현금</th>`
    : `<th>구간</th><th>가격</th><th>${active === "rebal" ? "주식" : "주식"}</th><th>현금</th>`;
  let rows = "";
  for (let i = 0; i <= ZONES; i++) {
    const cur = i === kNow;
    const done = i >= 1 && i <= kMax && t.mode !== "vhold";
    const reb = `${100 - i * UNIT} / ${i * UNIT}`, stk = `${i * UNIT} / ${100 - i * UNIT}`;
    const cells = both
      ? `<td class="${active === "rebal" ? (done ? "done" : "") : "off"}">${active === "rebal" && done ? "✓ " : ""}${reb}</td><td class="${active === "stake" ? (done ? "done" : "") : "off"}">${active === "stake" && done ? "✓ " : ""}${stk}</td>`
      : active === "rebal"
      ? `<td class="${done ? "done" : ""}">${done ? "✓ " : ""}${100 - i * UNIT}%</td><td>${i * UNIT}%</td>`
      : `<td class="${done ? "done" : ""}">${done ? "✓ " : ""}${i * UNIT}%</td><td>${100 - i * UNIT}%</td>`;
    rows += `<tr class="${cur ? "cur" : ""}" style="background:${cur ? "#D6E3FA" : i === 0 ? "transparent" : `rgba(47,111,214,${(0.03 + i * 0.02).toFixed(3)})`}"><td>${zoneLabel(i, step)}</td><td>${fmt(level(t.ref, i, s))}</td>${cells}</tr>`;
  }
  const note = active === "rebal"
    ? "종가가 그 행의 가격 아래로 마감하면 그 비율로 맞춥니다. ✓는 이미 판 구간."
    : `장중 저가가 그 행의 가격에 닿으면 10% 매수합니다 (간격 ${step}%). ✓는 이미 체결된 말뚝.`;
  return `<table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table><p class="note">${note}</p>`;
}

function renderTicker(t) {
  const cfg = cfgFor(t);
  const active = t.mode === "rebal" ? "rebal" : "stake";
  const step = active === "rebal" ? cfg.stepRebal : cfg.stepStake;
  const s = step / 100;
  const has = t.ref && t.lastClose != null;
  const kMax = t.kMax || 0;
  const badge = t.crisis ? `<span class="badge ${t.mode === "rebal" ? "" : t.mode}">${modeLabel[t.mode] || "리밸런싱"}</span>` : `<span class="badge">리밸런싱만</span>`;
  let status = "";
  if (has) {
    const k = zoneOf(t.ref, t.lastClose, s);
    const dd = (t.lastClose / t.ref - 1) * 100;
    const dir = /매수/.test(t.action || "") ? "up" : /매도/.test(t.action || "") ? "down" : "";
    const guide = [];
    if (t.mode === "rebal") {
      if (kMax < ZONES) guide.push(`종가가 ${fmt(level(t.ref, kMax + 1, s))} 아래로 마감하면 주식 10% 매도`);
      if (kMax >= 2) guide.push(`종가가 ${fmt(level(t.ref, kMax - 2, s))} 이상이면 전량 매수 (V자 반등)`);
      else if (kMax === 1) guide.push(`기준가 ${fmt(t.ref)} 회복 시 전량 매수`);
      if (t.crisis && state.market && state.market.crisis && !(t.log || []).some((e) => /말뚝박기 진입/.test(e.signal || ""))) guide.push("시장은 위기 상태입니다. 이미 말뚝박기 중이면 수동 조정에서 모드를 바꾸세요.");
    } else if (t.mode === "stake") {
      const orders = [];
      for (let i = kMax + 1; i <= Math.min(ZONES, kMax + 4); i++) orders.push(`<li>${fmt(level(t.ref, i, s))}에 10% (주식 ${i * UNIT}%)</li>`);
      if (orders.length) guide.push(`예약 매수 걸어둘 가격<ul class="orders">${orders.join("")}</ul>`);
      if (kMax >= 2) guide.push(`종가가 ${fmt(level(t.ref, kMax - 2, s))} 이상이면 남은 현금 전부 매수 (V자 반등)`);
    } else {
      guide.push(`종가가 ${fmt(level(t.ref, (t.vZone || 0) + 3, s))} 아래로 마감하면 전량 매도 후 말뚝박기`);
    }
    status = `<div class="status" style="border-left-color:${dir === "up" ? "var(--up)" : dir === "down" ? "var(--down)" : "var(--ink)"}">
      <div>${md(t.lastDate)} 종가 ${fmt(t.lastClose)}${t.mode === "stake" ? `, 저가 ${fmt(t.lastLow)}` : ""}, 기준가 ${fmt(t.ref)} 대비 <b>${fmtPct(dd)}</b>, ${zoneLabel(k, step)} 구간</div>
      <div class="act ${dir}">${t.signal && t.signal !== "시작" ? esc(t.signal) + ": " : "오늘 할 일: "}${esc(t.action || "")}</div>
      ${guide.map((g) => `<div class="guide">${g}</div>`).join("")}
    </div>`;
  } else {
    status = `<p class="empty">시세를 불러오면 최신 종가로 시작합니다. 기준가(전고점)와 현재 주식 비율은 수동 조정에서 맞춰 주세요.</p>`;
  }
  const table = t.ref ? renderTable(t, cfg) : "";
  const log = (t.log || []).slice(0, 7).map((e) => {
    const cls = /매수/.test(e.action || "") || /반등|갱신/.test(e.signal || "") ? "sig" : /매도/.test(e.action || "") ? "sigdown" : "";
    return `<div><span>${md(e.date)}</span><span>${fmt(e.close)}</span><span>${modeLabel[e.mode] || ""}</span><span>주식 ${e.stock}%</span>${e.signal ? `<span class="${cls}">${esc(e.signal)}</span>` : ""}</div>`;
  }).join("");
  const modeSel = t.crisis ? `<div><label for="mode-${t.sym}">모드</label><select id="mode-${t.sym}">${Object.keys(modeLabel).map((m) => `<option value="${m}" ${t.mode === m ? "selected" : ""}>${modeLabel[m]}</option>`).join("")}</select></div>` : "";
  return `<section class="panel">
    <div class="head"><span class="sym">${t.sym}</span><span class="desc">${esc(t.desc)}</span>${badge}</div>
    <div class="body">
      ${status}${table}
      ${log ? `<div class="log">${log}</div>` : ""}
      <details><summary>수동 조정</summary>
        <div class="grid">
          <div><label for="ref-${t.sym}">기준가 (전고점)</label><input id="ref-${t.sym}" inputmode="decimal" value="${t.ref == null ? "" : t.ref}"></div>
          <div><label for="stock-${t.sym}">현재 주식 비율 %</label><input id="stock-${t.sym}" type="number" step="10" min="0" max="100" value="${t.stock == null ? 100 : t.stock}"></div>
          ${modeSel}
        </div>
        <div class="row" style="margin-top:10px;justify-content:space-between">
          <button type="button" class="btn sec" data-save="${t.sym}">저장</button>
          <button type="button" class="link" data-high="${t.sym}">1년 최고 종가로 기준가</button>
          <button type="button" class="link" data-reset="${t.sym}">기록 지우기</button>
        </div>
      </details>
    </div>
  </section>`;
}

function renderSettingsInputs() {
  const s = state.settings;
  document.getElementById("apiKey").value = s.apiKey;
  document.getElementById("ndx").value = s.ndx;
  document.getElementById("threshold").value = s.threshold;
  document.getElementById("stepRebal").value = s.stepRebal;
  document.getElementById("stepHike").value = s.stepStakeHike;
  document.getElementById("stepZero").value = s.stepStakeZero;
}

function render() {
  const s = state.settings;
  document.getElementById("sub").textContent = `기준가에서 ${s.stepRebal}%씩 떨어질 때마다 주식 ${UNIT}%를 팔아 현금을 만듭니다. 나스닥 −3%가 뜨면 QLD는 말뚝박기(${stakeStep()}% 간격)로 바뀌고, BITX는 리밸런싱만 합니다.`;
  document.querySelectorAll("#regime button").forEach((b) => b.classList.toggle("on", b.dataset.r === s.regime));
  const up = document.getElementById("updated");
  const stamp = data && data.fetchedAt ? new Date(data.fetchedAt).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : null;
  up.textContent = (stamp ? `마지막 새로고침 ${stamp}` : "아직 시세를 불러오지 않았습니다.") + (memoryOnly ? " (이 브라우저에는 저장되지 않습니다)" : "");
  renderMarket();
  document.getElementById("tickers").innerHTML = Object.keys(state.tickers).map((sym) => renderTicker(state.tickers[sym])).join("");
  document.getElementById("rules").innerHTML = `<h2>이 앱이 따르는 규칙</h2><ul>
    <li>평시(리밸런싱): 기준가에서 ${s.stepRebal}% 떨어질 때마다 종가 기준 주식 ${UNIT}% 매도. 이미 판 구간은 다시 팔지 않고, 최저 구간에서 2구간 위로 종가가 올라오면 전량 매수(그 구간 가격이 새 기준가). 종가가 기준가를 넘으면 기준가 갱신.</li>
    <li>위기 진입: 나스닥(${esc(s.ndx)}) 종가 ${s.threshold}% 이하이면 QLD는 그 구간의 말뚝박기 주식 비율로 맞추고(기준가 구간이면 전량 매도), 아래 구간마다 ${UNIT}% 예약 매수. 간격은 금리인상기 ${s.stepStakeHike}%, 제로금리 ${s.stepStakeZero}%.</li>
    <li>말뚝박기 중: 장중 저가가 구간 가격에 닿으면 체결 처리. 최저 구간에서 2구간 위로 종가 회복 시 남은 현금 전부 매수(V반등 보유). 거기서 3구간 다시 떨어지면 전량 매도 후 말뚝박기 재진입(그 구간 가격이 새 사다리 기준).</li>
    <li>위기 종료: 마지막 −3% 발생일 + 달력 한 달 + 1일(한 달 안 4회면 두 달 + 1일)이 지나거나 나스닥이 8거래일 연속 상승하면 전량 매수하고 리밸런싱으로 복귀. 새 −3%가 뜨면 대기가 다시 시작.</li>
    <li>미국 장중에 열면 확정 전 봉은 반영하지 않습니다. 확정 종가는 한국 시간 새벽 5~6시 이후 반영됩니다.</li>
  </ul>`;
}

// ---------- 이벤트 ----------
document.getElementById("refresh").addEventListener("click", refresh);
document.getElementById("regime").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-r]");
  if (!b) return;
  state.settings.regime = b.dataset.r; save(); render();
});
document.getElementById("saveSettings").addEventListener("click", () => {
  const s = state.settings;
  const numOr = (id, prev) => { const v = parseFloat(document.getElementById(id).value); return Number.isFinite(v) ? v : prev; };
  s.apiKey = document.getElementById("apiKey").value.trim();
  s.ndx = (document.getElementById("ndx").value.trim() || "ONEQ").toUpperCase();
  s.threshold = numOr("threshold", s.threshold);
  s.stepRebal = numOr("stepRebal", s.stepRebal);
  s.stepStakeHike = numOr("stepHike", s.stepStakeHike);
  s.stepStakeZero = numOr("stepZero", s.stepStakeZero);
  save(); renderSettingsInputs(); render();
  showMsg("설정을 저장했습니다.");
  if (s.apiKey) refresh();
});
document.getElementById("wipe").addEventListener("click", () => {
  if (!window.confirm("설정과 기록을 모두 지울까요?")) return;
  store.del(KEY_STATE); store.del(KEY_DATA);
  location.reload();
});
document.getElementById("tickers").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-save],button[data-high],button[data-reset]");
  if (!b) return;
  if (b.dataset.save) manualSave(b.dataset.save);
  else if (b.dataset.high) fillHigh(b.dataset.high);
  else if (b.dataset.reset) resetTicker(b.dataset.reset);
});
window.addEventListener("error", (e) => showMsg("오류: " + (e.message || "알 수 없는 오류"), true));

// ---------- 시작 ----------
renderSettingsInputs();
render();
if (!store.set("rebal2x-probe", 1)) { memoryOnly = true; render(); }
if (state.settings.apiKey) refresh();
else document.getElementById("settings").open = true;
</script>
</body>
</html>
